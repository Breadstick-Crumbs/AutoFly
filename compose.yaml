services:
  autofly:
    build:
      context: .
      args:
        FLIGHT_GOAT_COMMIT: 854c0465aaa9c275485338c2be7ef0bcaddc4e89
        APP_UID: "${AUTOFLY_UID:-1000}"
        APP_GID: "${AUTOFLY_GID:-1000}"
    image: autofly:0.2.0
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - ./autofly-config:/etc/autofly:ro
      - autofly-data:/var/lib/autofly
    command: ["run"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

  setup:
    profiles: ["tools"]
    build:
      context: .
      args:
        FLIGHT_GOAT_COMMIT: 854c0465aaa9c275485338c2be7ef0bcaddc4e89
        APP_UID: "${AUTOFLY_UID:-1000}"
        APP_GID: "${AUTOFLY_GID:-1000}"
    image: autofly:0.2.0
    user: "${AUTOFLY_UID:-1000}:${AUTOFLY_GID:-1000}"
    stdin_open: true
    tty: true
    volumes:
      - ./:/setup
    command: ["setup", "--docker", "--config", "/setup/autofly-config/config.yaml", "--env-file", "/setup/.env"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    profiles: ["web"]
    build:
      context: .
      args:
        FLIGHT_GOAT_COMMIT: 854c0465aaa9c275485338c2be7ef0bcaddc4e89
        APP_UID: "${AUTOFLY_UID:-1000}"
        APP_GID: "${AUTOFLY_GID:-1000}"
    image: autofly:0.2.0
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    volumes:
      - ./autofly-config:/etc/autofly:rw
      - autofly-data:/var/lib/autofly
    command: ["web", "--host", "0.0.0.0", "--port", "8080", "--allow-remote"]
    ports:
      - "127.0.0.1:8080:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

volumes:
  autofly-data:
