name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip "setuptools>=83"
      - run: pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: pytest --cov=autofly --cov-report=term-missing
        env:
          AUTOFly_LIVE_TEST: "0"
      - run: python -m build
      - if: matrix.python-version == '3.12'
        run: sh scripts/smoke-install.sh
      - run: pip-audit --skip-editable

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p autofly-config && cp config.example.yaml autofly-config/config.yaml && cp .env.example .env
      - run: docker compose config --quiet && docker compose --profile web config --quiet
      - run: docker build --pull --tag autofly:ci .
      - run: docker compose run --rm autofly doctor

  docker-platforms:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          outputs: type=cacheonly
