name: Bug report
description: Report reproducible AutoFly behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include tokens, webhook URLs, cookies, browser profiles, or unredacted route history.
  - type: input
    id: version
    attributes:
      label: AutoFly and Flight GOAT versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps and sanitized configuration
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs

