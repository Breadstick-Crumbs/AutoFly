[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "autofly"
version = "0.1.0"
description = "Self-hosted flight-fare monitoring and notifications"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "AutoFly contributors"}]
keywords = ["flights", "fares", "self-hosted", "notifications"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyYAML>=6.0.2,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
playwright = ["playwright>=1.46,<2"]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pip-audit>=2.7",
  "pytest>=8.3",
  "pytest-cov>=5",
  "ruff>=0.6",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
autofly = "autofly.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/autofly"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = ["live: opt-in tests that access external fare sources"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["autofly"]

